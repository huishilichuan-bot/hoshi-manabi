name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 問題の自動検証
        run: node tools/build_precalc.js --check && node tools/build_dlg.js --check && node tools/build_audio.js --check && node tools/verify.js 40 && node tools/verify_content.js 5
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 公開するファイルだけを _site にまとめる（テスト・開発用の素材は公開しない）
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'tools' --exclude 'ref' --exclude 'dlg' --exclude 'screenshots' --exclude 'node_modules' --exclude 'README.md' --exclude '.gitignore' --exclude '*.py' --exclude '_s.js' ./ _site/
          test -f _site/index.html && test -f _site/sw.js && test -d _site/kanji
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
